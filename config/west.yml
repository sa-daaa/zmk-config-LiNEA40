manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: inorichi
      url-base: https://github.com/inorichi
    - name: keyfreaks
      url-base: https://github.com/kay-yokoyama
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: kot149
      url-base: https://github.com/kot149
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork
    # (v0.3-branch+dya は各モジュールの main が ZMK v4 移行済みで噛み合わなくなったため、
    #  記事執筆時期に近い v0.3+custom-studio-protocol を使用)
    - name: zmk
      remote: cormoran
      revision: v0.3+custom-studio-protocol
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: inorichi
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3-branch
    - name: zmk-mouse-gesture
      remote: kot149
      revision: v1
    - name: zmk-listeners
      remote: ssbb
      revision: v1
    # DYA Studio モジュール（すべて cormoran リポジトリ）
    # ble-management と runtime-input-processor は main が ZMK v4 移行済みのため、
    # 移行直前（2026年2月頃、v0.3+custom-studio-protocol と噛み合う時期）のコミットに固定
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 851661cd21
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: dbf92f764d
    # runtime-input-processor の永続化バックエンドとして必要（同じくv4移行直前に固定）
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: c26c7ff220
  self:
    path: config
