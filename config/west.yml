manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: inorichi
      url-base: https://github.com/inorichi
    - name: keyfreaks
      url-base: https://github.com/kay-yokoyama
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: kot149
      url-base: https://github.com/kot149
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork
    # (個別モジュールごとに要求するzmkコアパッチが異なり v0.3+custom-studio-protocol では
    #  噛み合わなかったため、全モジュールがまとまって追従している main+dya を使用。
    #  ただし ZMK v4/Zephyr 4.1 ベースであり、zmk-pmw3610-driver 等の既存モジュールとの
    #  互換性は未検証)
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
    # zmk-pmw3610-driver（inorichi）は削除: ZMK v4/Zephyr 4.1 に "pixart,pmw3610" の
    # devicetreeバインディングが標準搭載されており、外部モジュールと重複して衝突するため
    # main は ZMK v4 の zmk_endpoint_get_selected() 等の新APIと xiao_ble//zmk 用overlayに対応済み
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-mouse-gesture
      remote: kot149
      revision: v1
    - name: zmk-listeners
      remote: ssbb
      revision: v1
    # DYA Studio モジュール（すべて cormoran リポジトリ、main+dya と同じく最新main）
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    # runtime-input-processor の永続化バックエンド
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    # ランタイムでマクロ/コンボを編集できるようにする
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main
      import: true
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
      import: true
  self:
    path: config
